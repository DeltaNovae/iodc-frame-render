name: selftest

# Manual only for now. The scheduled render job arrives once publishing lands;
# keeping this dispatch-only avoids burning runs on an incomplete pipeline.
on:
  workflow_dispatch:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest tests -q

      # Hits the live service: proves slot discovery, pinning, validation and
      # compositing all still work against the real thing, not just fixtures.
      - name: Live self-test
        run: python selftest.py

      - name: Upload rendered frame
        uses: actions/upload-artifact@v4
        with:
          name: selftest-frame
          path: selftest-out.jpg
          retention-days: 7
