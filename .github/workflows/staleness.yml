name: staleness

# The render job failing is not, by itself, an incident: the previous frames
# keep serving and the next cycle is 15 minutes away. What matters is sustained
# failure — and that is invisible from the outside, because a dead pipeline
# still serves its last good frames and looks entirely healthy.
#
# It gets its own workflow rather than living inside the job whose death it is
# meant to detect.
#
# TWO properties, because a pipeline can fail either while passing the other:
#
#   AGE      is the newest capture recent?     catches a pipeline that stopped
#   SPACING  are captures evenly separated?    catches one that lost its cadence
#
# Spacing was added on 2026-08-11 to close a hole age could not see. If the
# Cloudflare render trigger dies, render.yml's own hourly schedule keeps
# publishing, so the newest frame stays comfortably inside any age limit and
# nothing appears wrong — while the loop degrades from smooth motion to a lurch.
# Age is blind to that by construction; only the gaps between captures show it.
#
# Retention is 12 captures, so each run reads the last ~3 hours. Running hourly
# therefore accumulates a continuous record of the cadence rather than sampling
# it — the 24-hour gap distribution the trigger's acceptance depends on is a
# by-product of leaving this alarm switched on.

on:
  schedule:
    - cron: '20 * * * *'      # hourly, offset off the render cadence
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: Age at which frames count as stale
        default: '120'
      max_gap_minutes:
        description: Spacing between captures at which cadence counts as broken
        default: '40'

permissions:
  contents: read
  issues: write

jobs:
  staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check what is live
        id: check
        # `shell: bash` is load-bearing, not decoration: it brings `pipefail`.
        # The default shell reports the exit status of the LAST command in a
        # pipeline, so piping through `tee` swallowed the failure and the alarm
        # stayed silent while reporting success. Caught by a drill, 2026-08-08.
        shell: bash
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          python verify.py \
            --max-age-minutes "${{ inputs.max_age_minutes || 120 }}" \
            --max-gap-minutes "${{ inputs.max_gap_minutes || 40 }}" \
            | tee check.txt

      - name: Open or update the tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Published frames are stale';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let detail = '_check output unavailable — see the workflow logs._';
            try { detail = '```\n' + fs.readFileSync('check.txt', 'utf8').trim() + '\n```'; } catch (e) {}

            const body = [
              'One of three things is wrong: the newest published capture is older',
              'than the staleness limit, a frame named by `meta.json` is missing, or',
              'captures have stopped arriving evenly.',
              '',
              'Readers are still being served the last good frames, so nothing looks',
              'broken from the outside — which is exactly why this check exists.',
              '',
              'If the failure is **spacing** rather than age, suspect the Cloudflare',
              'render trigger first. When it stops firing, the hourly fallback in',
              '`render.yml` keeps frames fresh while the cadence quietly degrades,',
              'which is precisely the state age cannot see. That trigger holds a',
              'token which expires on 2026-11-09.',
              '',
              detail,
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'staleness',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['staleness'],
              });
            }

      - name: Close the tracking issue once healthy again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'staleness',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Recovered — frames are fresh again. Run: ${runUrl}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed',
              });
            }
