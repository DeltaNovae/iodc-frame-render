name: render

on:
  # THE PRIMARY TRIGGER IS NO LONGER HERE. A Cloudflare Worker fires
  # workflow_dispatch every 15 minutes, because GitHub's scheduler cannot hold
  # a cadence: measured against a 20-minute cron, gaps of 33 / 62 / 129 minutes
  # plus two separate 99-minute idles inside one day. Firings are *dropped*,
  # not queued, so asking more often does not help.
  #
  # That raggedness is exactly what the four-cycle batch existed to paper over
  # — one run publishing four frames fourteen minutes apart, holding a runner
  # for a median of 47 minutes to cover a gap it could not predict. With a
  # trigger that keeps time, a run is one cycle and roughly three minutes,
  # which also means a broken render surfaces in minutes rather than after a
  # whole batch has published with it.
  #
  # This schedule stays as a FALLBACK: if the Worker dies, publishing degrades
  # to hourly instead of stopping.
  #
  # ⚠️ It fires EVERY hour regardless of whether the Worker is alive — cron
  # cannot know. That was the bug. While a scheduled firing took the four-cycle
  # batch it held the `render` concurrency group for ~47 of every 60 minutes,
  # and because GitHub keeps only ONE pending run per group, the Worker's :30
  # and :45 dispatches were cancelled while queued. Half the primary trigger's
  # work was discarded every hour, invisibly: cadence stayed flat at 15 minutes
  # because the batch published the very slots it had displaced, so every
  # external check read healthy. Measured 2026-08-17 over 30 runs — the pattern
  # repeated every hour without exception. The batch is gone (see CYCLES); a
  # scheduled run is now one cycle, like any other.
  #
  # ⚠️ A dead Worker is therefore NOT loudly visible: hourly frames will not
  # trip the 2-hour staleness alarm. Before the loop depends on this cadence,
  # tighten that alarm to match the cadence actually expected.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force a product instead of walking the ladder
        type: choice
        options: [auto, day, lowsun, night]
        default: auto
      dry_run:
        description: Render without publishing
        type: boolean
        default: false

concurrency:
  # Cycles must never overlap: two jobs writing meta.json at once could leave
  # the pointer naming frames the other one pruned.
  group: render
  cancel-in-progress: false

env:
  # ONE cycle, always. The Cloudflare trigger fires every 15 minutes, so a run
  # renders the newest slot and returns in ~3 minutes — which is also why a bad
  # render surfaces immediately instead of after a whole batch has published
  # with it.
  #
  # Batching used to survive for the fallback: `schedule` took four cycles, on
  # the stated premise that "a scheduled firing means the Worker is not
  # calling." That premise was false — cron fires on the hour whether or not
  # the Worker is healthy — so the fallback ran every hour and displaced the
  # primary trigger it exists to back up. See the schedule comment above.
  #
  # The trade, taken knowingly: if the Worker really does die, the fallback is
  # now one frame per hour rather than ~45 minutes of spread. Thinner — but it
  # is a fallback that costs nothing while the Worker is healthy, and a stalled
  # Worker is detected within ~15 minutes by an external monitor that shares no
  # failure domain with this repo.
  CYCLES: 1
  # Retained for the loop's sleep branch, which is unreachable while CYCLES is
  # 1. Just under an upstream slot, so any future multi-cycle run tracks new
  # captures rather than re-fetching one that has not changed.
  INTERVAL_SECONDS: 840

jobs:
  render:
    runs-on: ubuntu-latest
    # Covers the whole batch: four cycles and the three sleeps between them,
    # ~45 minutes, plus headroom for a slow fetch. A backstop, not a schedule —
    # overlap is prevented by the concurrency guard, not by this.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render and publish
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          case "$FORCE" in
            day)    ARGS="--force-day" ;;
            lowsun) ARGS="--force-lowsun" ;;
            night)  ARGS="--force-night" ;;
          esac
          if [ "$DRY_RUN" != "true" ]; then
            ARGS="$ARGS --publish"
          fi

          for i in $(seq 1 "$CYCLES"); do
            if [ "$i" -gt 1 ]; then
              echo "--- waiting ${INTERVAL_SECONDS}s for the next slot ---"
              sleep "$INTERVAL_SECONDS"
            fi
            echo "--- cycle $i of $CYCLES ---"
            # A single failed cycle is not an incident: the previous frames keep
            # serving and another cycle is minutes away. The loop must survive
            # it, so the failure is logged rather than raised. Sustained failure
            # is what matters, and staleness is how that is detected.
            python render.py $ARGS || echo "cycle $i failed; previous frames keep serving"
          done

      # Publishing without error is not the same as the result being usable:
      # read it back the way a client would. Runs once, after the last cycle.
      - name: Verify what is live
        if: ${{ !inputs.dry_run }}
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: python verify.py
