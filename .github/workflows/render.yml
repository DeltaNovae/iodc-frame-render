name: render

on:
  # Every 15 minutes, matching the upstream capture cadence. Actions schedules
  # are best-effort and drift under load, which is fine here: frames carry their
  # own capture time, so a late run publishes a correctly-labelled frame rather
  # than a wrong one. Missed slots are simply skipped — the next run picks up
  # whatever is newest.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force a product instead of choosing by sun elevation
        type: choice
        options: [auto, day, night]
        default: auto
      dry_run:
        description: Render without publishing
        type: boolean
        default: false

concurrency:
  # Cycles must never overlap: two jobs writing meta.json at once could leave
  # the pointer naming frames the other one pruned.
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render and publish
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          ARGS=""
          case "${{ inputs.force }}" in
            day)   ARGS="--force-day" ;;
            night) ARGS="--force-night" ;;
          esac
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python render.py $ARGS
          else
            python render.py $ARGS --publish
          fi
        # A single failed cycle is not an incident: the previous frames keep
        # serving, and the next run is 15 minutes away. Sustained failure is
        # what matters, and staleness is how it is detected.
        continue-on-error: true

      # Publishing without error is not the same as the result being usable:
      # read it back the way a client would.
      - name: Verify what is live
        if: ${{ !inputs.dry_run }}
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: python verify.py
