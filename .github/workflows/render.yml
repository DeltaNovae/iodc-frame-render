name: render

on:
  # Upstream produces a slot every 15 minutes, so that is the cadence worth
  # having — but **the schedule cannot deliver it**. Measured over 15 hours,
  # a '*/15' cron fired a median of 37 minutes apart (mean 44, worst 103) with
  # zero failures: GitHub throttles scheduled workflows on shared runners and
  # simply drops firings. Frames were reaching phones 30-100 minutes old.
  #
  # So the frequency comes from inside the run, not from the scheduler: each
  # firing renders CYCLES times, sleeping between. The cron is then only asking
  # "start a batch", which throttling can delay but not thin out.
  #
  # A batch is deliberately LONGER than the cron period (~45 min of work against
  # a 20 min ask). That inversion is the point. Throttling was later measured at
  # 95 minutes between firings — far worse than the 37 minute median first
  # sampled — so a batch has to cover a gap it cannot predict. The cron stays
  # frequent because firings are *dropped*, not queued: asking often is the only
  # way to be granted one.
  #
  # The consequence, accepted knowingly: when GitHub is generous, firings queue
  # behind the concurrency guard and this workflow runs near-continuously. It is
  # bounded — one job at a time, never overlapping — and public-repo minutes are
  # unmetered. Frames arriving on phones an hour and a half old is the worse
  # outcome of the two.
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force a product instead of walking the ladder
        type: choice
        options: [auto, day, lowsun, night]
        default: auto
      dry_run:
        description: Render without publishing
        type: boolean
        default: false

concurrency:
  # Cycles must never overlap: two jobs writing meta.json at once could leave
  # the pointer naming frames the other one pruned.
  group: render
  cancel-in-progress: false

env:
  # Four cycles at 14 minutes covers ~45 minutes from a single firing. Sized
  # against the observed 95-minute throttle gap: it does not close it, but it
  # turns one publish per gap into four, which is what the on-screen age
  # actually follows.
  #
  # A manual dispatch renders once and returns — nobody watching a run wants to
  # wait out three sleeps to see the result. Only the schedule batches.
  CYCLES: ${{ github.event_name == 'schedule' && 4 || 1 }}
  # Just under an upstream slot, so cycles track new captures rather than
  # re-fetching one that has not changed.
  INTERVAL_SECONDS: 840

jobs:
  render:
    runs-on: ubuntu-latest
    # Covers the whole batch: four cycles and the three sleeps between them,
    # ~45 minutes, plus headroom for a slow fetch. A backstop, not a schedule —
    # overlap is prevented by the concurrency guard, not by this.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render and publish
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          case "$FORCE" in
            day)    ARGS="--force-day" ;;
            lowsun) ARGS="--force-lowsun" ;;
            night)  ARGS="--force-night" ;;
          esac
          if [ "$DRY_RUN" != "true" ]; then
            ARGS="$ARGS --publish"
          fi

          for i in $(seq 1 "$CYCLES"); do
            if [ "$i" -gt 1 ]; then
              echo "--- waiting ${INTERVAL_SECONDS}s for the next slot ---"
              sleep "$INTERVAL_SECONDS"
            fi
            echo "--- cycle $i of $CYCLES ---"
            # A single failed cycle is not an incident: the previous frames keep
            # serving and another cycle is minutes away. The loop must survive
            # it, so the failure is logged rather than raised. Sustained failure
            # is what matters, and staleness is how that is detected.
            python render.py $ARGS || echo "cycle $i failed; previous frames keep serving"
          done

      # Publishing without error is not the same as the result being usable:
      # read it back the way a client would. Runs once, after the last cycle.
      - name: Verify what is live
        if: ${{ !inputs.dry_run }}
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: python verify.py
